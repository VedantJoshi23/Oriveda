# Oriveda Taxonomy
#
# Machine-readable ID-prefix rules. This is the source of truth; the root
# README's "Naming Convention" section is the human-readable restatement
# of exactly this data — if they ever disagree, this file wins (per
# Principle 4: documentation is executable knowledge).
#
# scope: framework  — this ID series belongs to Oriveda itself, lives
#                      under knowledge/ in THIS repository.
# scope: project     — this ID series belongs to a target project
#                      consuming Oriveda, lives in THAT project's own
#                      repository, never here (ADR-0001, ADR-0002).

prefixes:
  OV:
    name: Specification
    scope: framework
    pattern: 'OV-[0-9]{3}'
    description: >
      A reusable Oriveda protocol (OV-000 through OV-008 today). Each
      describes HOW an artifact is produced for any target project, not
      a specific project's own artifact.
    example: OV-002

  ADR:
    name: Architecture Decision Record
    scope: framework
    pattern: 'ADR-[0-9]{4}'
    description: >
      A decision about Oriveda itself (this repository). A target
      project's own architecture decisions use the same ADR- prefix but
      live in that project's own decisions/ folder, not here.
    example: ADR-0003

  DOM:
    name: Domain
    scope: project
    pattern: 'DOM-[A-Z0-9][A-Z0-9-]*'
    description: A bounded context, per a target project's OV-006 output.
    example: DOM-CATALOG

  FEAT:
    name: Feature
    scope: project
    pattern: 'FEAT-[A-Z0-9][A-Z0-9-]*'
    description: A feature specification, per a target project's OV-007 output.
    example: FEAT-WISHLIST

  STD:
    name: Standard
    scope: project
    pattern: 'STD-[A-Z0-9][A-Z0-9-]*'
    description: >
      A convention in one of the nine candidate categories, per a target
      project's OV-005 output.
    example: STD-API

  PRM:
    name: Prompt
    scope: framework
    pattern: 'PRM-[A-Z-]+'
    description: >
      One of the seven fixed catalog prompts defined by OV-008. Unlike
      DOM/FEAT/STD, this is a closed, framework-defined set — not
      something a target project invents its own instances of.
    example: PRM-FEATURE
    fixed_values:
      - PRM-DISCOVERY
      - PRM-CONSTITUTION
      - PRM-ARCHITECTURE
      - PRM-STANDARDS
      - PRM-DOMAIN
      - PRM-FEATURE
      - PRM-REVIEW

  DISC:
    name: Discovery investigation
    scope: project
    pattern: 'DISC-[A-Z0-9][A-Z0-9-]*'
    description: >
      One of a target project's ten OV-001 investigations or its
      recommendations roll-up (ADR-0004).
    example: DISC-RECOMMENDATIONS

  CONST:
    name: Constitution
    scope: project
    pattern: 'CONST-[A-Z0-9][A-Z0-9-]*'
    description: A target project's Engineering Constitution, per OV-002 (ADR-0004).
    example: CONST-CORE

  ARCH:
    name: Architecture
    scope: project
    pattern: 'ARCH-[A-Z0-9][A-Z0-9-]*'
    description: A target project's system architecture, per OV-003 (ADR-0004).
    example: ARCH-SYSTEM

  EVD:
    name: Evidence item
    scope: project
    pattern: 'EVD-[0-9]{3}'
    description: >
      One entry in a target project's evidence log, per OV-000. Scoped
      per project — never accumulates across unrelated projects.
    example: EVD-001

  KC:
    name: Knowledge claim
    scope: project
    pattern: 'KC-[0-9]{3}'
    description: >
      One atomic assertion extracted from evidence, per OV-000's
      evidence.schema.yaml.
    example: KC-014

  DIV:
    name: Divergence
    scope: project
    pattern: 'DIV-[0-9]{3}'
    description: >
      One recorded disagreement between code and a not-yet-Frozen
      specification, per ADR-0005. Lives in a target project's divergence
      log (templates/divergence-log-template.md); blocks that spec from
      being Frozen while open.
    example: DIV-001

  DIVERGENCE:
    name: Divergence log
    scope: project
    pattern: 'DIVERGENCE-LOG'
    description: >
      A target project's single divergence log, at
      knowledge/decisions/DIVERGENCE-LOG.md (ADR-0007 rule 5). Its rows are
      DIV-NNN entries.
    example: DIVERGENCE-LOG
